name: Ontology Validation

on:
  workflow_call:
    inputs:
      report:
        description: Where to commit the JUnit report when all tests pass on a push, e.g. docs/current/validation_report.xml
        default: validation_report.xml
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontology repository
        uses: actions/checkout@v4

      - name: Checkout validation tools
        uses: actions/checkout@v4
        with:
          repository: SPAROntologies/sparontologies.github.io
          path: .tools
          sparse-checkout: scripts/test_ontology.py
          sparse-checkout-cone-mode: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Run ontology tests
        env:
          REPORT: ${{ inputs.report }}
        run: |
          mkdir -p "$(dirname "$REPORT")"
          export TOOLS_SHA=$(git -C .tools rev-parse HEAD)
          uvx --python 3.13 --with rdflib==7.6.0 --with owlrl==7.6.2 --with requests==2.34.2 \
            --with owlready2==0.51 --with codespell==2.4.3 pytest==9.2.0 \
            .tools/scripts/test_ontology.py -p no:cacheprovider -rs --junitxml="$REPORT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: ${{ inputs.report }}

      - name: Commit report
        if: github.event_name == 'push'
        env:
          REPORT: ${{ inputs.report }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git diff --cached --quiet || git commit -m "DOCS: update validation report"
          git pull --rebase
          git push
